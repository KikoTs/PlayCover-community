name: Build nightly release
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"
env:
  CI: true
jobs:
  build:
    runs-on: macos-14
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.0

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies
        shell: bash
        run: |
          brew install graphicsmagick imagemagick swiftlint
          gem install fastlane
          bundle install
          pip install setuptools
          npm install --global https://github.com/PlayCover/create-dmg

      - name: Set build number
        shell: bash
        run: |
          fastlane run increment_build_number build_number:${{ github.run_number }}

      - name: Install signing cert
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k ~/Library/Keychains/build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Fastlane Nightly
        shell: bash
        run: fastlane nightly
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
        
      - name: Create DMG manually
        run: |
          hdiutil create -volname "PlayCover" -srcfolder ./output/PlayCover.app -ov -format UDZO ./output/PlayCover_nightly_${{ github.run_number }}.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.3.0
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: output/PlayCover_nightly_${{ github.run_number }}.dmg
